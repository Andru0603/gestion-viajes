<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cambiar contraseña &mdash; Manifiesto de viajes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Work+Sans:wght@400;500;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/estilos.css">
<style>
    body { display: flex; align-items: center; justify-content: center; min-height: 100vh; }
    .caja-login { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 2rem; max-width: 360px; width: 100%; }
    .caja-login h1 { font-size: 1.3rem; }
    .caja-login form { margin-top: 1.25rem; }
    .mensaje { font-size: 0.85rem; margin: 0.75rem 0 0; display: none; }
    .mensaje.error { color: var(--terracotta); }
    .mensaje.exito { color: var(--turquoise); }
    .volver { display: inline-block; margin-top: 1rem; font-size: 0.85rem; color: var(--ink-muted); }
</style>
</head>
<body>
    <div class="caja-login">
        <h1>Cambiar contraseña</h1>
        <form id="form-password">
            <label>Contraseña actual
                <input type="password" name="passwordActual" required>
            </label>
            <label>Contraseña nueva
                <input type="password" name="passwordNueva" required minlength="4">
            </label>
            <button type="submit" class="boton-guardar">Guardar</button>
        </form>
        <p class="mensaje error" id="mensaje-error"></p>
        <p class="mensaje exito" id="mensaje-exito"></p>
        <a class="volver" href="/">&larr; Volver al sistema</a>
    </div>
    <script>
        document.getElementById('form-password').addEventListener('submit', async e => {
            e.preventDefault();
            const form = new FormData(e.target);
            const datos = {
                passwordActual: form.get('passwordActual'),
                passwordNueva: form.get('passwordNueva')
            };
            const errorEl = document.getElementById('mensaje-error');
            const exitoEl = document.getElementById('mensaje-exito');
            errorEl.style.display = 'none';
            exitoEl.style.display = 'none';

            const resp = await fetch('/api/usuarios/cambiar-password', {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(datos)
            });

            if (resp.ok) {
                exitoEl.textContent = 'Contraseña actualizada correctamente';
                exitoEl.style.display = 'block';
                e.target.reset();
            } else {
                const texto = await resp.text();
                errorEl.textContent = texto || 'No se pudo actualizar la contraseña';
                errorEl.style.display = 'block';
            }
        });
    </script>
</body>
</html>
